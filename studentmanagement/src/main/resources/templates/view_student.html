<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            display:flex;
            margin:0;
            font-family: Arial, sans-serif;
            background:#f4f6f9;
        }

        .sidebar{
            width:230px;
            background:#1f1f1f;
            color:white;
            height:100vh;
            padding:20px;
            position:fixed;
        }

        .sidebar h4{
            margin-bottom:25px;
        }

        .sidebar a{
            display:block;
            color:white;
            margin:12px 0;
            text-decoration:none;
            padding:8px 10px;
            border-radius:6px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#0d6efd;
            color:white;
        }

        .content{
            margin-left:230px;
            width:100%;
            padding:30px;
        }

        .header-box{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .detail-card{
            background:white;
            padding:28px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
            max-width:850px;
        }

        .detail-row{
            padding:12px 0;
            border-bottom:1px solid #eee;
        }

        .detail-row:last-child{
            border-bottom:none;
        }

        .label{
            font-weight:600;
            color:#444;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4>Student MS</h4>
    <a href="/">Dashboard</a>
    <a href="/addStudent">Add Student</a>
    <a href="/students">Student List</a>
    <a href="/courses/add">Add Course</a>
    <a href="/courses/list">Course List</a>
    <a href="/enroll">Enroll Course</a>
</div>

<div class="content">

    <div class="header-box">
        <h2>Student Details</h2>
        <a href="/students" class="btn btn-secondary">⬅ Back to List</a>
    </div>

    <div class="detail-card">

        <div class="detail-row">
            <span class="label">ID :</span>
            <span th:text="${student.id}"></span>
        </div>

        <div class="detail-row">
            <span class="label">First Name :</span>
            <span th:text="${student.firstName}"></span>
        </div>

        <div class="detail-row">
            <span class="label">Last Name :</span>
            <span th:text="${student.lastName}"></span>
        </div>

        <div class="detail-row">
            <span class="label">Email :</span>
            <span th:text="${student.email}"></span>
        </div>

        <div class="detail-row">
            <span class="label">Phone :</span>
            <span th:text="${student.phone}"></span>
        </div>

        <div class="detail-row">
            <span class="label">Address :</span>
            <span th:text="${student.address}"></span>
        </div>

    </div>

</div>

</body>
</html>
