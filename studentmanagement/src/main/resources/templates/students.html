<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            display:flex;
            margin:0;
            font-family: Arial, sans-serif;
            background:#f4f6f9;
        }

        .sidebar{
            width:230px;
            background:#1f1f1f;
            color:white;
            height:100vh;
            padding:20px;
            position:fixed;
        }

        .sidebar h4{
            margin-bottom:25px;
        }

        .sidebar a{
            display:block;
            color:white;
            margin:12px 0;
            text-decoration:none;
            padding:8px 10px;
            border-radius:6px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#0d6efd;
            color:white;
        }

        .content{
            margin-left:230px;
            width:100%;
            padding:30px;
        }

        .header-box{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .card-box{
            background:white;
            padding:22px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
        }

        .table thead{
            background:#222;
            color:white;
        }

        .action-btn{
            padding:5px 10px;
            border-radius:6px;
            margin-right:5px;
            text-decoration:none;
            color:white;
            font-size:14px;
        }

        .view-btn{
            background:#17a2b8;
        }

        .edit-btn{
            background:#ffc107;
            color:black;
        }

        .delete-btn{
            background:#dc3545;
        }

        .search-box{
            margin-bottom:18px;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h4>Student MS</h4>
    <a href="/">Dashboard</a>
    <a href="/addStudent">Add Student</a>
    <a href="/students">Student List</a>
    <a href="/courses/add">Add Course</a>
    <a href="/courses/list">Course List</a>
    <a href="/enroll">Enroll Course</a>
</div>

<div class="content">

    <div class="header-box">
        <h2>Students</h2>
        <a href="/addStudent" class="btn btn-primary">+ Add New Student</a>
    </div>

    <form action="/students/search" method="get" class="search-box">
        <input type="text"
               name="name"
               placeholder="Search student by name"
               class="form-control w-25 d-inline">

        <button class="btn btn-success">Search</button>
        <a href="/students" class="btn btn-secondary">Reset</a>
    </form>

    <div class="card-box">

        <table class="table table-bordered table-striped">

            <thead>
                <tr>
                    <th>ID</th>
                    <th>FIRST NAME</th>
                    <th>LAST NAME</th>
                    <th>EMAIL</th>
                    <th>PHONE</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>

            <tbody>

                <tr th:each="s : ${students}">

                    <td th:text="'#STU' + ${s.id}"></td>
                    <td th:text="${s.firstName}"></td>
                    <td th:text="${s.lastName}"></td>
                    <td th:text="${s.email}"></td>
                    <td th:text="${s.phone}"></td>

                    <td>
                        <a th:href="@{'/viewStudent/' + ${s.id}}"
                           class="action-btn view-btn">👁</a>

                        <a th:href="@{'/editStudent/' + ${s.id}}"
                           class="action-btn edit-btn">✏</a>

                        <a th:href="@{'/deleteStudent/' + ${s.id}}"
                           class="action-btn delete-btn"
                           onclick="return confirm('Are you sure to delete?')">🗑</a>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</body>
</html>
