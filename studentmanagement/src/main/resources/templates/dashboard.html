<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            display:flex;
            background:#f4f6f9;
        }

        .sidebar{
            width:230px;
            background:#1f1f1f;
            color:white;
            height:100vh;
            padding:20px;
            position:fixed;
        }

        .sidebar h4{
            margin-bottom:25px;
            font-weight:600;
        }

        .sidebar a{
            display:block;
            color:white;
            margin:12px 0;
            text-decoration:none;
            padding:8px 10px;
            border-radius:6px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#0d6efd;
            color:white;
        }

        .content{
            margin-left:230px;
            width:100%;
            padding:30px;
        }

        .page-title{
            font-size:28px;
            font-weight:600;
            margin-bottom:25px;
            color:#222;
        }

        .card-box{
            padding:22px;
            color:white;
            border-radius:12px;
            text-align:center;
            box-shadow:0 2px 8px rgba(0,0,0,0.08);
            transition:0.3s;
        }

        .card-box:hover{
            transform:translateY(-4px);
        }

        .card-box h5{
            font-size:16px;
            margin-bottom:10px;
        }

        .card-box h3{
            font-size:28px;
            font-weight:bold;
        }

        .action-bar{
            margin:28px 0;
        }

        .action-bar .btn{
            margin-right:10px;
            border-radius:8px;
            padding:8px 16px;
        }

        .welcome-box{
            background:white;
            padding:25px;
            border-radius:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.06);
        }

        .welcome-box h5{
            margin-bottom:10px;
        }

        .welcome-box p{
            color:#666;
            margin-bottom:0;
        }
		h1{
			color:blue;
			font-size:40px;
			font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
		}
    </style>
</head>

<body>

<div class="sidebar">
    <h4>Student MS</h4>

    <a href="/">Dashboard</a>
    <a href="/addStudent">Add Student</a>
    <a href="/students">Student List</a>
    <a href="/courses/add">Add Course</a>
    <a href="/courses/list">Course List</a>
    <a href="/enroll">Enroll Course</a>
	<a href="/enrolled-students">View enrolled students</a>
	<a href="/logout">Logout</a>
			  
	
	
</div>

<div class="content">

   
	        <h1><b>Welcome to Student Management System</b></h1>
	        
    <div class="row g-4">

        <div class="col-md-3">
            <div class="card-box bg-primary">
                <h5>Total Students</h5>
                <h3 th:text="${totalStudents}">0</h3>
            </div>
        </div>

		<div class="col-md-3">
		    <div class="card-box bg-success">
		        <h5>Active Courses</h5>
		        <h3 th:text="${totalCourses}">0</h3>
		    </div>
		</div>

        <div class="col-md-3">
            <div class="card-box bg-info">
                <h5>Top Course</h5>
				<h6 th:text="${topCourse}">N/A</h6>
            </div>
        </div>

        <div class="col-md-3">
            <div class="card-box bg-secondary">
                <h5>This Month Enrollments</h5>
				<h3 th:text="${monthlyEnrollments}">0</h3>
            </div>
        </div>

    </div>

    
</div>

</body>
</html>
