<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Enroll Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f5f7fb;
            font-family:Arial, sans-serif;
        }
		.sidebar{
		            width:230px;
		            background:#1f1f1f;
		            color:white;
		            height:100vh;
		            padding:20px;
		            position:fixed;
		        }

		        .sidebar h4{
		            margin-bottom:25px;
		        }

		        .sidebar a{
		            display:block;
		            color:white;
		            margin:12px 0;
		            text-decoration:none;
		            padding:8px 10px;
		            border-radius:6px;
		            transition:0.3s;
		        }

		        .sidebar a:hover{
		            background:#0d6efd;
		            color:white;
		        }
        .container-box{
            width:900px;
            margin:40px auto;
        }
        .top-box{
            background:#4663f0;
            color:white;
            padding:25px;
            border-radius:10px;
            margin-bottom:25px;
        }
        .card{
            border:none;
            border-radius:12px;
            box-shadow:0 3px 12px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body>
	<div class="sidebar">
	    <h4>Student MS</h4>
	    <a href="/">Dashboard</a>
	    <a href="/addStudent">Add Student</a>
	    <a href="/students">Student List</a>
	    <a href="/courses/add">Add Course</a>
	    <a href="/courses/list">Course List</a>
	    <a href="/enroll">Enroll Course</a>
		<a href="/enrolled-students">View enrolled students</a>
					  
	</div>


<div class="container-box">

    <div class="top-box">
        <h2>Enroll Student to Course</h2>
        <p class="mb-0">Assign students to available courses.</p>
    </div>

    <div class="card p-4">
		<div th:if="${param.duplicate}" class="alert alert-warning">
		    Student is already enrolled in this course.
		</div>
		<form th:action="@{/saveEnroll}" method="post">

		    <div class="mb-3">
		        <label>Student</label>
		        <select class="form-select" name="studentId" required>
		            <option value="">Select Student</option>
		            <option th:each="student : ${students}"
		                    th:value="${student.id}"
		                    th:text="${student.firstName}">
		            </option>
		        </select>
		    </div>

		    <div class="mb-3">
		        <label>Course</label>
		        <select class="form-select" name="courseId" required>
		            <option value="">Select Course</option>
		            <option th:each="course : ${courses}"
		                    th:value="${course.id}"
		                    th:text="${course.courseName}">
		            </option>
		        </select>
		    </div>

			<div class="mb-3">
			    <label>Enroll Date</label>
			    <input type="date" name="enrollDate" class="form-control" required>
			</div>

		    <button type="submit" class="btn btn-primary">Enroll</button>

		</form>
    </div>

</div>

</body>
</html>
